name: Quran Source Health Check

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  push:
    paths:
      - "scripts/check_quran_health.py"
      - ".github/workflows/quran-source-health.yml"
  workflow_dispatch:

jobs:
  quran-health:
    name: Check Quran API availability and freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Quran source health check
        id: health
        run: |
          python scripts/check_quran_health.py \
            --output-json quran-health-report.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload health report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-health-report
          path: quran-health-report.json
          retention-days: 30

      - name: Fail on down status
        run: |
          STATUS=$(python -c "import json; r=json.load(open('quran-health-report.json')); print(r['status'])")
          echo "Quran API status: $STATUS"
          if [ "$STATUS" = "down" ]; then
            echo "::error::Quran API is DOWN - provider outage detected"
            exit 2
          elif [ "$STATUS" = "degraded" ]; then
            echo "::warning::Quran API is DEGRADED - performance issue detected"
          fi
