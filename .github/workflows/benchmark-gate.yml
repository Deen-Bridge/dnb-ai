name: Benchmark Release Gate

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "scripts/**"
      - "app/**"
      - "data/eval/**"
      - "data/quran/**"
  workflow_dispatch:
    inputs:
      report_path:
        description: "Path to the benchmark report JSON file"
        required: false
        default: "data/eval/results_islamic_qa_benchmark.json"

permissions:
  contents: read
  pull-requests: read

jobs:
  benchmark-gate:
    name: Benchmark Release Gate (AI-102)
    runs-on: ubuntu-22.04

    steps:
      - name: Detect benchmark-affecting changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            benchmark_inputs:
              - 'app/**'
              - '*.py'
              - 'providers/**'
              - 'prompts/**'
              - 'safety/**'
              - 'retrieval/**'
              - 'data/eval/**'
              - 'data/quran/**'
              - 'scripts/eval_islamic_qa.py'
              - 'scripts/benchmark_release_gate.py'
              - 'scripts/build_islamic_qa_benchmark.py'
              - 'scripts/benchmark_data/**'

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.14"
          cache: "pip"
          cache-dependency-path: |
            requirements-installer.lock
            requirements.lock
            requirements-dev.lock

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-installer.lock
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock

      - name: Validate benchmark report schema
        run: |
          python scripts/eval_islamic_qa.py --validate-only
        continue-on-error: false

      - name: Run benchmark gate tests
        run: |
          pytest -q tests/test_benchmark_release_gate.py -v \
            --tb=short \
            --no-header
        env:
          PYTHONPATH: "."

      - name: Check benchmark report exists
        id: check_report
        run: |
          REPORT="${{ github.event.inputs.report_path || 'data/eval/results_islamic_qa_benchmark.json' }}"
          if [ -f "$REPORT" ]; then
            echo "report_exists=true" >> "$GITHUB_OUTPUT"
            echo "report_path=$REPORT" >> "$GITHUB_OUTPUT"
          else
            echo "report_exists=false" >> "$GITHUB_OUTPUT"
            echo "No benchmark report found at $REPORT - skipping gate check."
          fi

      - name: Run release gate evaluation
        if: >-
          steps.check_report.outputs.report_exists == 'true' &&
          (github.event_name != 'pull_request' || steps.changes.outputs.benchmark_inputs == 'true')
        run: |
          python scripts/benchmark_release_gate.py \
            "${{ steps.check_report.outputs.report_path }}"
        env:
          PYTHONPATH: "."

      - name: Upload gate result as artifact
        if: >-
          always() &&
          steps.check_report.outputs.report_exists == 'true' &&
          (github.event_name != 'pull_request' || steps.changes.outputs.benchmark_inputs == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-gate-result
          path: data/eval/results_islamic_qa_benchmark.json
          retention-days: 90

      - name: Annotate PR with gate summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = '${{ steps.check_report.outputs.report_path }}';
            const gateApplicable = '${{ steps.changes.outputs.benchmark_inputs }}' === 'true';
            let summary = '### Benchmark Release Gate (AI-102)\n\n';

            if (!gateApplicable) {
              summary += '> **Not applicable** — this PR does not change benchmark-affecting inputs. ';
              summary += 'The checked-in calibration report is not treated as release evidence.\n';
            } else if ('${{ steps.check_report.outputs.report_exists }}' !== 'true') {
              summary += '> **Skipped** — no benchmark report present. ';
              summary += 'If this PR changes model, prompt, or evaluation logic, ';
              summary += 'run `python scripts/eval_islamic_qa.py` and commit the report.\n';
            } else {
              summary += '| Check | Status |\n|---|---|\n';
              summary += '| Held-out evaluation type | Required |\n';
              summary += '| Scholar sign-off | Required |\n';
              summary += '| Composite score >= 70% | Required |\n';
              summary += '| Quran diacritical accuracy >= 98% | Required |\n';
              summary += '| Confidence intervals present | Required |\n';
              summary += '| Versioned artifact fields | Required |\n';
              summary += '| Unadjudicated sacred-text mismatches = 0 | Required |\n';
              summary += '| Rollback criteria defined | Required |\n';
            }

            await core.summary.addRaw(summary).write();

  quran-provider-gate:
    name: Quran Provider Health Gate (AI-101)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.14"
          cache: "pip"
          cache-dependency-path: |
            requirements-installer.lock
            requirements.lock
            requirements-dev.lock

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-installer.lock
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock

      - name: Run Quran provider tests
        run: |
          pytest -q tests/test_quran_provider.py -v \
            --tb=short \
            --no-header
        env:
          PYTHONPATH: "."

      - name: Verify surah index fixture integrity
        run: |
          python -c "
          import json, sys
          with open('data/quran/surah_index.json') as f:
              idx = json.load(f)
          surahs = idx if isinstance(idx, list) else list(idx.values())
          assert len(surahs) == 114, f'Expected 114 surahs, got {len(surahs)}'
          total = sum(s.get('verses_count') or s.get('ayah_count') or s.get('total_verses') or 0 for s in surahs)
          assert total == 6236, f'Expected 6236 ayat, got {total}'
          print(f'Surah index OK: 114 surahs, {total} ayat')
          "

      - name: Check provider contract document exists
        run: |
          test -f data/quran/PROVIDER_CONTRACT.md || \
          test -f docs/quran_provider_contract.md || \
          (echo 'Provider contract document missing' && exit 1)
