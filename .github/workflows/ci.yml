name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy .

      - name: Run offline safety and red-team tests
        run: pytest -q tests/redteam

      - name: Run study generator tests
        run: pytest -q tests/test_study.py

      - name: Run learning-path recommendation tests
        run: pytest -q tests/test_learning.py

      - name: Run semantic cache tests
        run: pytest -q tests/test_semantic_cache.py

      - name: Run retrieval infrastructure tests
        run: pytest -q tests/test_retrieval_chunking.py tests/test_retrieval_index.py tests/test_build_index.py

      - name: Verify retrieval backfill is idempotent (offline demo)
        run: |
          python scripts/build_index.py --index-path /tmp/ci-index.db --fake-embeddings
          python scripts/build_index.py --index-path /tmp/ci-index.db --fake-embeddings | tee /tmp/ci-backfill-2.log
          grep -q "0 added, 0 updated" /tmp/ci-backfill-2.log

      - name: Run hybrid search tests
        run: pytest -q tests/test_hybrid_search.py

      - name: Run fiqh tests
        run: pytest -q tests/test_fiqh.py

      - name: Run hadith grading tests
        run: pytest -q tests/test_hadith.py

      - name: Run structured citation tests
        run: pytest -q tests/test_citations.py tests/test_citations_integration.py

      - name: Run confidence and abstention tests
        run: pytest -q tests/test_confidence.py

      - name: Run scholar-review queue tests
        run: pytest -q tests/test_review_queue.py

      - name: Run tafsir tests
        run: pytest -q tests/test_tafsir.py

      - name: Run zakat and nisab tests
        run: pytest -q tests/test_zakat.py

      - name: Run purchase history chat tests
        run: pytest -q tests/test_purchases.py

      - name: Run feedback loop tests
        run: pytest -q tests/test_feedback.py

      - name: Run LLM telemetry tests
        run: pytest -q tests/test_telemetry.py

      - name: Run structured logging tests
        run: pytest -q tests/test_structured_logging.py

      - name: Run multilingual support tests
        run: pytest -q tests/test_multilingual.py

      - name: Run memory profile tests
        run: pytest -q tests/test_memory_profile.py

      - name: Run memory extraction tests
        run: pytest -q tests/test_memory_extraction.py

      - name: Run memory integration tests
        run: pytest -q tests/test_memory_integration.py

      - name: Run per-user personal context tests
        run: pytest -q tests/test_personal_context.py

      - name: Run prompt registry and A/B experiment tests
        run: pytest -q tests/test_prompt_registry.py

      - name: Run Islamic answer evaluation harness tests
        run: pytest -q tests/test_evals.py

      - name: Run chat endpoint tests
        run: pytest -q tests/test_chat_api.py

      - name: Run chat request validation tests
        run: pytest -q tests/test_chat_validation.py

      - name: Run Swahili language processing tests
        run: pytest -q tests/test_swahili.py

      - name: Run offline citation extraction eval
        run: python scripts/eval_citations.py

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t deenbridge-ai:ci .

      - name: Verify container starts and /ping returns 200
        run: |
          docker run -d --name test-ai -p 8000:8000 -e GEMINI_API_KEY=dummy deenbridge-ai:ci
          timeout 30s bash -c 'until curl -sf http://localhost:8000/ping; do sleep 1; done'
          docker logs test-ai
          docker stop test-ai

  perf:
    name: Performance Budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install locust==2.42.2
      - name: Start mock service
        env:
          MOCK_UPSTREAMS: '1'
          MOCK_LLM_LATENCY_MS: '50'
          MOCK_HORIZON_LATENCY_MS: '25'
          SAFETY_PIPELINE_ENABLED: 'false'
          AUTH_DISABLED: 'true'
          GEMINI_API_KEY: ''
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/deenbridge-ai.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:8000/ping && break || sleep 1; done
      - name: Run load test
        run: |
          locust -f loadtest/locustfile.py --headless -H http://127.0.0.1:8000 -u 10 -r 2 -t 45s --csv=/tmp/locust --only-summary
      - name: Check budget
        run: python loadtest/check_budget.py loadtest/budget.yaml /tmp/locust_stats.csv
