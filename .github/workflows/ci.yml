name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy .

      - name: Run full test suite
        run: pytest -q tests/

      - name: Verify retrieval backfill is idempotent (offline demo)
        run: |
          python scripts/build_index.py --index-path /tmp/ci-index.db --fake-embeddings
          python scripts/build_index.py --index-path /tmp/ci-index.db --fake-embeddings | tee /tmp/ci-backfill-2.log
          grep -q "0 added, 0 updated" /tmp/ci-backfill-2.log

      - name: Verify the streaming cache measurably cuts latency (offline)
        timeout-minutes: 5
        run: python -m scripts.bench_stream_cache --rounds 3 --chunk-delay 0.2

      - name: Benchmark Quran phoneme alignment
        run: python -m scripts.bench_phoneme_alignment

      - name: Validate theme-verse concordance dataset
        run: python scripts/build_theme_mappings.py --check

      - name: Run offline citation extraction eval
        run: python scripts/eval_citations.py

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t deenbridge-ai:ci .

      - name: Verify container starts and /ping returns 200
        run: |
          docker run -d --name test-ai -p 8000:8000 -e GEMINI_API_KEY=dummy deenbridge-ai:ci
          timeout 30s bash -c 'until curl -sf http://localhost:8000/ping; do sleep 1; done'
          docker logs test-ai
          docker stop test-ai
          docker rm test-ai

  perf:
    name: Performance Budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install locust>=2.42.2
      - name: Start mock service
        env:
          MOCK_UPSTREAMS: '1'
          MOCK_LLM_LATENCY_MS: '50'
          MOCK_HORIZON_LATENCY_MS: '25'
          SAFETY_PIPELINE_ENABLED: 'false'
          AUTH_DISABLED: 'true'
          RATE_LIMIT_ENABLED: 'false'
          GEMINI_API_KEY: ''
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/deenbridge-ai.log 2>&1 &
          success=0
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ping; then
              echo "Mock service started successfully on attempt $attempt"
              success=1
              break
            fi
            sleep 1
          done
          if [ "$success" -ne 1 ]; then
            echo "Mock service failed to start. Logs:"
            cat /tmp/deenbridge-ai.log
            exit 1
          fi
      - name: Run load test
        run: |
          locust -f loadtest/locustfile.py --headless -H http://127.0.0.1:8000 -u 10 -r 2 -t 45s --csv=/tmp/locust --only-summary
      - name: Check budget
        run: python loadtest/check_budget.py loadtest/budget.yaml /tmp/locust_stats.csv
