# ==============================================================================
# Redis Sentinel Configuration for Automated Failover & High Availability
# ==============================================================================

# --- NETWORK & DAEMON ---
port 26379
bind 0.0.0.0
protected-mode no
dir /tmp
logfile ""
daemonize no

# --- SENTINEL MONITORING ---
# Syntax: sentinel monitor <master-group-name> <ip> <port> <quorum>
# The quorum is the number of Sentinels that need to agree about the fact the master
# is not reachable in order to mark it in ODOWN (Objectively Down) state and start failover.
# With 3 Sentinels, quorum is set to 2.
sentinel monitor mymaster redis-master 6379 2

# --- AUTHENTICATION (if password enabled on master) ---
# sentinel auth-pass mymaster <your-strong-password>

# --- TIMEOUTS & THRESHOLDS ---
# Milliseconds a master, replica, or sentinel must be unresponsive to be considered SDOWN (Subjectively Down).
sentinel down-after-milliseconds mymaster 5000

# Failover timeout in milliseconds. If failover is not completed within this time,
# another Sentinel can attempt a new failover.
sentinel failover-timeout mymaster 60000

# Number of replicas that can be reconfigured in parallel to use the new master after a failover.
# Setting this to 1 ensures replicas sync one by one, keeping other replicas available to serve reads.
sentinel parallel-syncs mymaster 1

# --- NOTIFICATION & RECONFIGURATION SCRIPTS (Optional) ---
# sentinel notification-script mymaster /var/redis/notify.sh
# sentinel client-reconfig-script mymaster /var/redis/reconfig.sh

# --- SECURITY ---
# Prevent runtime modification of notification and client-reconfig scripts
sentinel deny-scripts-reconfig yes
