# ==============================================================================
# Redis Server Configuration for High Availability (Master / Replica)
# ==============================================================================

# --- NETWORK & GENERAL ---
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
logfile ""
databases 16

# --- SNAPSHOTTING (RDB Persistence) ---
# Save the DB on disk:
# save <seconds> <changes>
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# --- REPLICATION (Master-Replica HA) ---
# For replicas, configure:
# replicaof <masterip> <masterport>

# When a replica loses connection, it continues to serve stale data (yes)
replica-serve-stale-data yes

# Replicas reject write commands
replica-read-only yes

# Sync strategy: diskless replication allows streaming RDB directly to sockets
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-diskless-sync-max-replicas 0
repl-diskless-load disabled

# Disable TCP_NODELAY on replication socket to save bandwidth
repl-disable-tcp-nodelay no

# Priority for Sentinel promotion (lower is higher priority; 0 means never promote)
replica-priority 100

# Minimum replicas to write (optional safeguard for split-brain protection)
# min-replicas-to-write 1
# min-replicas-max-lag 10

# --- SECURITY & AUTHENTICATION ---
# requirepass <your-strong-password>
# masterauth <your-strong-password>

# --- MEMORY MANAGEMENT ---
# Set maximum memory usage (e.g. 512mb, 1gb, 2gb)
maxmemory 512mb
# Eviction policy when maxmemory is reached
maxmemory-policy allkeys-lru
maxmemory-samples 5

# --- APPEND ONLY MODE (AOF Persistence) ---
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# Fsync policy: 'everysec' provides great performance with max 1s data loss risk
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# --- LUA SCRIPTING ---
lua-time-limit 5000

# --- SLOW LOG ---
slowlog-log-slower-than 10000
slowlog-max-len 128

# --- LATENCY MONITOR ---
latency-monitor-threshold 0

# --- ADVANCED CONFIG ---
hash-max-listpack-entries 512
hash-max-listpack-value 64
list-max-listpack-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-listpack-entries 128
zset-max-listpack-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
