services:
  - type: web
    name: deenbridge-ai
    env: python  # To switch to Docker: replace with `runtime: docker` and remove buildCommand/startCommand
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
