services:
  - type: web
    name: deenbridge-ai
    env: python  # To switch to Docker: replace with `runtime: docker` and remove buildCommand/startCommand
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SERVICE_API_KEY
        sync: false
      - key: LLM_PRIMARY
        value: gemini
      - key: LLM_FALLBACKS
        value: ""
